name: Shopify Theme Deploy

on:
  push:
    branches:
      - main
      - Mi-primer-proyecto
    paths:
      - 'theme/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: Install Shopify CLI
        run: |
          npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Shopify
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
        run: |
          shopify theme push --path=theme --store=$SHOPIFY_SHOP --password=$SHOPIFY_CLI_THEME_TOKEN --allow-live
