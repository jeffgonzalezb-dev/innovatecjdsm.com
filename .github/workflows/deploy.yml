name: Deploy Theme a Shopify

on:
  push:
    branches:
      - main
      - Mi-primer-proyecto
    paths:
      - 'theme/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Deploy theme to Shopify
        run: |
          shopify theme push --path=theme --allow-live
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Theme deployed successfully!"
          echo "Store: ${{ secrets.SHOPIFY_STORE_URL }}"
