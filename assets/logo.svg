<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bluePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0066;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="200" height="200" fill="#0A0E27"/>
  
  <!-- Anillo exterior con brillo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#bluePink)" stroke-width="1" opacity="0.5" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#bluePink)" stroke-width="2.5" filter="url(#strongGlow)"/>
  
  <!-- Nombre completo estilizado -->
  <text x="100" y="100" font-family="'Courier New', monospace" font-size="28" font-weight="900" 
        text-anchor="middle" fill="url(#bluePink)" filter="url(#strongGlow)">
    innovatec
  </text>
  
  <text x="100" y="128" font-family="'Courier New', monospace" font-size="28" font-weight="900" 
        text-anchor="middle" fill="#FF0066" filter="url(#strongGlow)">
    jdsm
  </text>
  
  <!-- Línea decorativa verde neón -->
  <line x1="50" y1="138" x2="150" y2="138" stroke="#00FF99" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Detalles de neón puro -->
  <circle cx="30" cy="40" r="3" fill="#FF0066" filter="url(#strongGlow)"/>
  <circle cx="170" cy="160" r="3" fill="#00FF99" filter="url(#strongGlow)"/>
  <circle cx="100" cy="25" r="2.5" fill="#0066FF" filter="url(#glow)"/>
</svg>